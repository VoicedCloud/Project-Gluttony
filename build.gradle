buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.9.3"
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects - findProject(':android')) { //change it to "project" when its time to configure the android project
  apply plugin: 'java-library'
  java.sourceCompatibility = 17
  java.targetCompatibility = 17

  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    File assetsFolder = new File("${project.rootDir}/assets/")
    File assetsFile = new File(assetsFolder, "assets.txt")
    assetsFile.delete()

    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'Glutton'
  
  // Define versions for HyperLap2D and Artemis-ODB here
  ext.h2dVersion = '0.1.7' 
  ext.artemisVersion = '2.3.0'

  repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'Glutton-parent'

project(':core') {
  dependencies {
    // Existing core libGDX dependencies
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    
    // 1. Mandatory box2d module (Required by HyperLap2D runtime even if you don't use physics)
    api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    
    // 2. HyperLap2D Core Runtime
    api "games.rednblack.hyperlap2d:runtime-libgdx:$h2dVersion"
    
    // 3. Mandatory ECS Engine (HyperLap2D utilizes Artemis-ODB under the hood)
    api "net.onedaybeard.artemis:artemis-odb:$artemisVersion"
    
    // 4. (Optional) Uncomment these if you use advanced features in your editor:
    // api "games.rednblack.hyperlap2d:libgdx-spine-extension:$h2dVersion"
    // api "games.rednblack.hyperlap2d:libgdx-talos-extension:$h2dVersion"
  }
}
